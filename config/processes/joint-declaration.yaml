# Tier-2 process (ADR-0005): Joint Declaration — correcting a member's profile (JD SOP 2024, illustrative).
# member submits → employer attests → DA initiates → SS or AO verifies → APFC (major) or AO (minor) decides.
# member-service owns the contract: on APPROVED it applies the correction and publishes MemberChangeApproved.v1.
process: joint_declaration
owner: member
title: Joint Declaration (profile correction)
subject: uan
case_kind: JOINT_DECLARATION
sla_days: 15
terminal_states: [APPROVED, REJECTED, RETURNED_BY_EMPLOYER, REJECTED_BY_EMPLOYER]
derive:
  change_class:                     # JD SOP Table 3 (illustrative): who approves depends on what changes
    from: parameter
    map:
      MAJOR: [NAME, DATE_OF_BIRTH, GENDER]
      MINOR: [FATHER_NAME, MOTHER_NAME, MARITAL_STATUS, NATIONALITY, DATE_OF_JOINING]
operations:
  - name: submit
    operation: POST /members/me/joint-declarations
    starts: true
    subject_from: actor               # the member's own UAN, never a UAN from the request
    roles: [member]
    scope: self
    step_up: submit-joint-declaration
    to: SUBMITTED
    form:
      parameter: {enum: [NAME, DATE_OF_BIRTH, GENDER, FATHER_NAME, MOTHER_NAME, MARITAL_STATUS, NATIONALITY, DATE_OF_JOINING]}
      current_value: {min_length: 1, max_length: 120}
      corrected_value: {min_length: 1, max_length: 120}
      reason: {min_length: 10, max_length: 1000}
      document_ref: {optional: true, max_length: 80}
  - name: employer_queue
    operation: GET /employers/me/joint-declarations
    roles: [employer.signatory]
    scope: establishment
    lists: {states: [SUBMITTED]}
  - name: attest
    operation: POST /employers/me/joint-declarations/{jdId}/decisions
    case_from: path:jdId
    roles: [employer.signatory]
    scope: establishment
    step_up: {action: attest-joint-declaration, bind: case}
    from: SUBMITTED
    outcomes: {field: decision, map: {ATTEST: EMPLOYER_ATTESTED, RETURN: RETURNED_BY_EMPLOYER, REJECT: REJECTED_BY_EMPLOYER}}
    form:
      decision: {enum: [ATTEST, RETURN, REJECT]}
      note: {min_length: 5, max_length: 1000}
  - name: office_queue
    operation: GET /office/member-change-requests
    roles: [fo.da_accounts]
    lists: {states: [EMPLOYER_ATTESTED]}
  - name: initiate
    operation: POST /office/member-change-requests/{requestId}/recommendations
    case_from: path:requestId
    roles: [fo.da_accounts]
    from: EMPLOYER_ATTESTED
    to: INITIATED
    form:
      documents_checked: {enum: ["YES"]}
      note: {min_length: 10}
  - name: verify
    operation: POST /office/member-change-requests/{requestId}/verifications
    case_from: path:requestId
    roles: [fo.ss, fo.ao]
    from: INITIATED
    to: VERIFIED
    form:
      finding: {enum: [CONSISTENT, INCONSISTENT]}
      note: {min_length: 10}
  - name: decide
    operation: POST /office/member-change-requests/{requestId}/decisions
    case_from: path:requestId
    roles_by: {field: change_class, map: {MAJOR: [fo.apfc], MINOR: [fo.ao]}}
    step_up: {action: decide-joint-declaration, bind: case}
    from: VERIFIED
    outcomes: {field: decision, map: {APPROVE: APPROVED, REJECT: REJECTED, RETURN: EMPLOYER_ATTESTED}}
    new_round_on: [EMPLOYER_ATTESTED]        # returned to the DA: the office steps are done again
    form:
      decision: {enum: [APPROVE, REJECT, RETURN]}
      reason: {min_length: 10}
  - name: pendency
    operation: GET /office/member-change-requests/pendency
    roles: [fo.rpfc1, fo.oic]
    lists: {states: [SUBMITTED, EMPLOYER_ATTESTED, INITIATED, VERIFIED], summary: true}
