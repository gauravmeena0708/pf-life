# Tier-2 process (ADR-0005): transfer of PF from a previous member ID to the current one (Form 13, illustrative).
# member submits → present employer attests → DA verifies → AO approves. contribution-service owns the contract:
# on APPROVED it moves the balance (a balanced journal) and publishes TransferPosted.v1; the member downloads
# Annexure K (the transfer statement).
process: transfer_form13
owner: contribution
title: Transfer of PF (Form 13)
subject: uan
case_kind: TRANSFER
sla_days: 20
visible_to_member: true
ledger_lock: CLAIM_ADJUDICATION      # the member's ledger is locked while the transfer is open
terminal_states: [APPROVED, REJECTED, REJECTED_BY_EMPLOYER]
operations:
  - name: submit
    operation: POST /members/me/transfers
    starts: true
    subject_from: actor
    roles: [member]
    scope: self
    step_up: submit-transfer
    to: SUBMITTED
    form:
      from_account_link_id: {account: {owner: self, exited: true, not_transferred: true}}
      to_account_link_id: {account: {owner: self, exited: false, primary: true}}   # the primary member ID only (P2.7d)
      attesting_employer: {enum: [PRESENT]}
  - name: status
    operation: GET /members/me/transfers/{transferId}
    case_from: path:transferId
    roles: [member]
    scope: self
    reads: true
  - name: employer_queue
    operation: GET /employers/me/transfer-requests
    roles: [employer.signatory]
    scope: establishment
    lists: {states: [SUBMITTED]}
  - name: attest
    operation: POST /employers/me/transfer-requests/{transferId}/decisions
    case_from: path:transferId
    roles: [employer.signatory]
    scope: establishment
    step_up: {action: attest-transfer, bind: case}
    from: SUBMITTED
    outcomes: {field: decision, map: {ATTEST: EMPLOYER_ATTESTED, REJECT: REJECTED_BY_EMPLOYER}}
    produces_document:               # the employer's digitally signed Form 13 (a mock DSC)
      type: FORM13_EMPLOYER_SIGNED
      title: Employer-signed Form 13
      declaration: Certified that the member's service and wages are as recorded; the transfer is attested.
      on_states: [EMPLOYER_ATTESTED]
    form:
      decision: {enum: [ATTEST, REJECT]}
      note: {min_length: 5, max_length: 1000}
  - name: office_queue
    operation: GET /office/transfers
    roles: [fo.da_accounts, fo.ao]
    lists: {states: [EMPLOYER_ATTESTED, VERIFIED]}
  - name: verify
    operation: POST /office/transfers/{transferId}/verifications
    case_from: path:transferId
    roles: [fo.da_accounts]
    from: EMPLOYER_ATTESTED
    to: VERIFIED
    requires_viewed: FORM13_EMPLOYER_SIGNED    # "View the employer signed pdf first"
    form:
      service_checked: {enum: ["YES"]}
      note: {min_length: 10}
  - name: decide
    operation: POST /office/transfers/{transferId}/decisions
    case_from: path:transferId
    roles: [fo.ao]
    step_up: {action: decide-transfer, bind: case}
    recheck_primary: to_account_link_id      # refused if the member's primary member ID has moved meanwhile
    from: VERIFIED
    outcomes: {field: decision, map: {APPROVE: APPROVED, REJECT: REJECTED, RETURN: EMPLOYER_ATTESTED}}
    new_round_on: [EMPLOYER_ATTESTED]
    form:
      decision: {enum: [APPROVE, REJECT, RETURN]}
      reason: {min_length: 10}
