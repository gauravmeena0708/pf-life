# The BASELINE rule set. ILLUSTRATIVE ONLY — not the EPF Scheme's rules. Amounts in paise, rates in basis points.
#
# This file seeds the first published version. After that, rule sets are drafted, checked, approved and
# published in platform-service (Policy administration); every service applies the version in force on the
# relevant date (the claim date, or the first day of an ECR wage month) and records the version it used.
ILLUSTRATIVE_ONLY: true
rule_version: demo-rules-2026.1
effective_from: "2026-04-01"
contribution:
  epf_employee_rate_bp: 1200
  eps_rate_bp: 833
  eps_wage_ceiling_paise: 1500000
  eps_age_limit_years: 58
  edli_rate_bp: 50
  edli_wage_ceiling_paise: 1500000
  admin_charges_rate_bp: 50
  admin_charges_min_paise: 50000
  edli_admin_rate_bp: 0
rounding: nearest_rupee_half_up
validation:
  headcount_change_warning_pct: 20
claims:
  auto_settlement_limit_paise: 10000000        # default for types that do not set their own
  settlement_sla_days: 20
  # Conditions a claim type may use (all optional): requires_active_employment, requires_exit_months,
  # min_service_months, once_every_months, max_from (employee_share | total_balance), max_pct_bp, cap_paise.
  # auto_settle_up_to_paise: null = always reviewed by an officer. approval_bands: overrides the default chain.
  # retired: true = no new claims of this type (claims in progress continue).
  types:
    ADVANCE_ILLNESS:
      form_type: "31"
      label: Advance for medical treatment
      plain_rule: You can withdraw up to your own (employee) share, capped at ₹10,00,000, while still employed.
      requires_active_employment: true
      max_from: employee_share
      cap_paise: 100000000
      auto_settle_up_to_paise: 10000000
    FINAL_SETTLEMENT:
      form_type: "19"
      label: Final settlement after leaving employment
      plain_rule: After leaving employment for at least two months you can withdraw your full balance.
      requires_exit_months: 2
      max_from: total_balance
      auto_settle_up_to_paise: 10000000
  # Default approval chain by amount (docs/stakeholder-activities.yaml → claim_settlement). Chain shape:
  # fo.da_accounts, then fo.ss or fo.ao, then optionally fo.apfc and/or fo.oic.
  approval_bands:
    - {upto_paise: 5000000, chain: [fo.da_accounts, fo.ss]}
    - {upto_paise: 50000000, chain: [fo.da_accounts, fo.ao]}
    - {upto_paise: 250000000, chain: [fo.da_accounts, fo.ss, fo.apfc]}
    - {upto_paise: null, chain: [fo.da_accounts, fo.ao, fo.oic]}
  # After an account is de-frozen, claims whose approvals were voided restart under this stricter matrix
  # (stakeholder-activities.yaml → claim_settlement_after_defreeze).
  after_defreeze_bands:
    - {upto_paise: 5000000, chain: [fo.da_accounts, fo.ss, fo.apfc]}
    - {upto_paise: 50000000, chain: [fo.da_accounts, fo.ao, fo.apfc]}
    - {upto_paise: null, chain: [fo.da_accounts, fo.ao, fo.apfc, fo.oic]}
  # Re-disbursement after a bank return: the member's new account must pass the mock penny-drop check and
  # an APFC approves; adjudication is not reopened.
  redisbursement_approver: fo.apfc
interest:
  # Annual interest on EPF accounts: the rate declared for each financial year (illustrative figures). It is
  # worked out on each month's closing balance (monthly running balance) and credited once the year has ended.
  # A revised rate for a year already credited credits (or recovers) only the difference.
  rates_bp: {"2025-26": 825}
tds:
  # Tax deducted at source on PF withdrawals, applied on the payment date (ILLUSTRATIVE — not the Income-tax Act).
  applies_to_claim_types: [FINAL_SETTLEMENT]
  threshold_paise: 5000000                # no TDS on a withdrawal below ₹50,000
  rate_with_pan_bp: 1000                  # 10% when the member's PAN is verified
  rate_without_pan_bp: 2000               # 20% without a verified PAN
  exempt_after_service_months: 60         # no TDS after 5 years of continuous service
  form_15g_15h_waiver: true               # a Form 15G / 15H for the year waives TDS
pension:
  # EPS monthly pension (ILLUSTRATIVE): pensionable salary x pensionable service / divisor.
  divisor: 70
  salary_months: 60                       # pensionable salary = average of the last 60 months' EPS wages
  pensionable_salary_cap_paise: 1500000
  min_service_years: 10
  weightage_years: 2                      # added to service ...
  weightage_after_service_years: 20       # ... once service reaches 20 years
  normal_age_years: 58
  earliest_age_years: 50
  early_reduction_bp_per_year: 400        # 4% less for each year before the normal age
  minimum_pension_paise: 100000           # ₹1,000 a month
  applies_to_pensions_in_payment: true    # a change also revises pensions already in payment (never downwards)
  revise_in_payment_from: null            # optional earlier date for those revisions (arrears are paid); null = the rule set's date
grievances:
  categories: [CLAIM_DELAY, CLAIM_REJECTION, PASSBOOK, KYC, EMPLOYER, OTHER]
  sla_days: {RO: 15, ZO: 10, HO: 7}
  reopen_window_days: 30
