# The BASELINE rule set. ILLUSTRATIVE ONLY — not the EPF Scheme's rules. Amounts in paise, rates in basis points.
#
# This file seeds the first published version. After that, rule sets are drafted, checked, approved and
# published in platform-service (Policy administration); every service applies the version in force on the
# relevant date (the claim date, or the first day of an ECR wage month) and records the version it used.
ILLUSTRATIVE_ONLY: true
rule_version: demo-rules-2026.1
effective_from: "2026-04-01"
contribution:
  epf_employee_rate_bp: 1200
  eps_rate_bp: 833
  eps_wage_ceiling_paise: 1500000
  eps_age_limit_years: 58
  edli_rate_bp: 50
  edli_wage_ceiling_paise: 1500000
  admin_charges_rate_bp: 50
  admin_charges_min_paise: 50000
  edli_admin_rate_bp: 0
rounding: nearest_rupee_half_up
validation:
  headcount_change_warning_pct: 20
claims:
  auto_settlement_limit_paise: 10000000        # default for types that do not set their own
  settlement_sla_days: 20
  # Conditions a claim type may use (all optional): requires_active_employment, requires_exit_months,
  # min_service_months, once_every_months, max_from (employee_share | total_balance), max_pct_bp, cap_paise.
  # auto_settle_up_to_paise: null = always reviewed by an officer. approval_bands: overrides the default chain.
  # retired: true = no new claims of this type (claims in progress continue).
  types:
    ADVANCE_ILLNESS:
      form_type: "31"
      label: Advance for medical treatment
      plain_rule: You can withdraw up to your own (employee) share, capped at ₹10,00,000, while still employed.
      requires_active_employment: true
      max_from: employee_share
      cap_paise: 100000000
      auto_settle_up_to_paise: 10000000
    FINAL_SETTLEMENT:
      form_type: "19"
      label: Final settlement after leaving employment
      plain_rule: After leaving employment for at least two months you can withdraw your full balance.
      requires_exit_months: 2
      max_from: total_balance
      auto_settle_up_to_paise: 10000000
    PENSION_WITHDRAWAL:
      form_type: "10C"
      label: Pension withdrawal benefit (Form 10C)
      plain_rule: With less than 9½ years of pension (EPS) service, two months after leaving you can take the EPS money as a lump sum, by Table D.
      requires_exit_months: 2
      max_service_months: 113                  # 9 years 5 months; from 9½ years a monthly pension (or scheme certificate) applies
      once_every_months: 1200                  # once per member ID
      max_from: eps_table_d                    # factor for the completed years of service x wages at the EPS ceiling (ILLUSTRATIVE)
      table_d_factor_x100: [102, 205, 310, 418, 528, 640, 754, 870, 988]
      auto_settle_up_to_paise: null            # always scrutinised (CITES: initiator, then verifier / approver)
  # Default approval chain by amount (docs/stakeholder-activities.yaml → claim_settlement). Chain shape:
  # fo.da_accounts, then fo.ss or fo.ao, then optionally fo.apfc and/or fo.oic.
  approval_bands:
    - {upto_paise: 5000000, chain: [fo.da_accounts, fo.ss]}
    - {upto_paise: 50000000, chain: [fo.da_accounts, fo.ao]}
    - {upto_paise: 250000000, chain: [fo.da_accounts, fo.ss, fo.apfc]}
    - {upto_paise: null, chain: [fo.da_accounts, fo.ao, fo.oic]}
  # After an account is de-frozen, claims whose approvals were voided restart under this stricter matrix
  # (stakeholder-activities.yaml → claim_settlement_after_defreeze).
  after_defreeze_bands:
    - {upto_paise: 5000000, chain: [fo.da_accounts, fo.ss, fo.apfc]}
    - {upto_paise: 50000000, chain: [fo.da_accounts, fo.ao, fo.apfc]}
    - {upto_paise: null, chain: [fo.da_accounts, fo.ao, fo.apfc, fo.oic]}
  # Re-disbursement after a bank return: the member's new account must pass the mock penny-drop check and
  # an APFC approves; adjudication is not reopened.
  redisbursement_approver: fo.apfc
interest:
  # Annual interest on EPF accounts: the rate declared for each financial year (illustrative figures). It is
  # worked out on each month's closing balance (monthly running balance) and credited once the year has ended.
  # A revised rate for a year already credited credits (or recovers) only the difference.
  rates_bp: {"2025-26": 825}
tds:
  # Tax deducted at source on PF withdrawals, applied on the payment date (ILLUSTRATIVE — not the Income-tax Act).
  applies_to_claim_types: [FINAL_SETTLEMENT]
  threshold_paise: 5000000                # no TDS on a withdrawal below ₹50,000
  rate_with_pan_bp: 1000                  # 10% when the member's PAN is verified
  rate_without_pan_bp: 2000               # 20% without a verified PAN
  exempt_after_service_months: 60         # no TDS after 5 years of continuous service
  form_15g_15h_waiver: true               # a Form 15G / 15H for the year waives TDS
  taxable_interest_threshold_paise: 25000000   # interest on the employee's own contributions above ₹2,50,000 a year is taxable
pension:
  # EPS monthly pension (ILLUSTRATIVE): pensionable salary x pensionable service / divisor.
  divisor: 70
  salary_months: 60                       # pensionable salary = average of the last 60 months' EPS wages
  pensionable_salary_cap_paise: 1500000
  min_service_years: 10
  weightage_years: 2                      # added to service ...
  weightage_after_service_years: 20       # ... once service reaches 20 years
  normal_age_years: 58
  earliest_age_years: 50
  early_reduction_bp_per_year: 400        # 4% less for each year before the normal age
  minimum_pension_paise: 100000           # ₹1,000 a month
  applies_to_pensions_in_payment: true    # a change also revises pensions already in payment (never downwards)
  revise_in_payment_from: null            # optional earlier date for those revisions (arrears are paid); null = the rule set's date
  # Family pension on a member's death in service (ILLUSTRATIVE; no minimum service or age): the spouse gets
  # spouse_share_bp of the member's formula pension (salary x service years / divisor), at least spouse_minimum_paise;
  # each child (up to max_children) gets child_share_of_spouse_bp of the spouse's pension, at least child_minimum_paise.
  family:
    spouse_share_bp: 5000
    spouse_minimum_paise: 100000
    child_share_of_spouse_bp: 2500
    child_minimum_paise: 25000
    max_children: 2
death_claims:
  # Claims on a member's death, filed by a nominee or legal heir (ILLUSTRATIVE). Form 20 pays the PF balance to the
  # beneficiaries in their shares; Form 5IF pays the EDLI assurance benefit from the EDLI fund:
  # wage_multiplier x average monthly wages (capped at the EDLI ceiling) + a share of the average PF balance
  # (capped), not less than the minimum (with at least minimum_needs_service_months of service) and not more than the maximum.
  edli:
    wage_multiplier: 35
    average_balance_share_bp: 5000
    balance_bonus_cap_paise: 17500000
    minimum_paise: 25000000
    maximum_paise: 70000000
    minimum_needs_service_months: 12
grievances:
  categories: [CLAIM_DELAY, CLAIM_REJECTION, PASSBOOK, KYC, EMPLOYER, OTHER]
  sla_days: {RO: 15, ZO: 10, HO: 7}
  reopen_window_days: 30
late_payment:
  # Contributions for a wage month are due by due_day of the next month (ILLUSTRATIVE). A later payment raises
  # demands: 14B damages at the band's yearly rate for the months of delay, and 7Q interest at a yearly rate for
  # the days of delay, both on the amount paid late. The employer pays them with a miscellaneous direct challan,
  # which the office knocks off against the demands.
  due_day: 15
  damages_14b_bands:                      # up to N months late (null = beyond) -> yearly rate
    - {upto_months: 2, rate_bp_pa: 500}
    - {upto_months: 4, rate_bp_pa: 1000}
    - {upto_months: 6, rate_bp_pa: 1500}
    - {upto_months: null, rate_bp_pa: 2500}
  interest_7q_rate_bp_pa: 1200
vishwas:
  # ILLUSTRATIVE settlement of disputed 14B damages: on approval the establishment pays this share of the damages it
  # applied for and the rest is waived, as one revised demand. Not the terms of any actual EPFO scheme.
  settlement_share_bp: 3000
higher_pension:
  # Joint option for pension on higher wages (ILLUSTRATIVE, after the Supreme Court's judgment of 4 November 2022):
  # a member of the pension scheme in service on in_service_on, whose wages were above the wage ceiling, may opt
  # jointly with the employer. The employer validates the wages; the dues are the employer's pension share
  # (eps_share_bp) of the wages above the ceiling for each month, moved from the PF account to the pension fund.
  # Interest on the dues is not worked out here.
  in_service_on: "2014-09-01"
  eps_share_bp: 833
  wage_ceilings:                          # the ceiling from a wage month onwards
    - {from_month: "1995-11", ceiling_paise: 500000}
    - {from_month: "2001-06", ceiling_paise: 650000}
    - {from_month: "2014-09", ceiling_paise: 1500000}
international_workers:
  # International workers (foreign nationals employed in India) are members with different rules — ILLUSTRATIVE,
  # after EPF Scheme para 83, simplified; not the Scheme's text. Contributions are on the full wages (no wage
  # ceiling). Only the claim types listed are open to them, and a final settlement only when one condition holds:
  # the age of retirement, or a nationality whose social-security agreement with India lets the PF be paid on
  # leaving. The agreement countries are India's partners (names only; the terms are not modelled here).
  no_wage_ceiling: true
  claim_types: [FINAL_SETTLEMENT]
  final_settlement_on:
    min_age: 58
    agreement_nationalities: [Belgium, Germany, Switzerland, Luxembourg, France, Denmark, Korea, Netherlands, Hungary,
                              Finland, Sweden, Czech Republic, Norway, Austria, Canada, Australia, Japan, Portugal, Quebec,
                              Brazil]

# P2.10a: vigilance cases (illustrative; after the CVC's pattern for complaints and preliminary inquiries)
vigilance:
  pi_days: 90                  # a preliminary inquiry is due this many days after it is assigned
  sources: [CAIU_SIGNAL, MEMBER_REPORT, PUBLIC_COMPLAINT, STAFF_COMPLAINT, CVC, MINISTRY]
  outcomes: [CLOSED_NO_SUBSTANCE, MINOR_PENALTY_PROCEEDINGS, MAJOR_PENALTY_PROCEEDINGS, REFERRED_TO_CBI, SYSTEM_IMPROVEMENT]
  # P2.10b: preventive vigilance (illustrative, after the CVC's rotation guidance)
  sensitive_posts: [fo.da_compliance, fo.eo, fo.icf, fo.recovery_officer, fo.cash, fo.admin]
  rotation_alert_months: 30    # an officer on a sensitive post is flagged for rotation at this tenure …
  rotation_limit_months: 36    # … and is overdue for rotation at this one
  clearance_valid_days: 90     # a vigilance clearance is valid this long
  clearance_purposes: [POSTING_SENSITIVE, PROMOTION, RETIREMENT, DEPUTATION, PASSPORT_NOC]
  withholding_outcomes: [MINOR_PENALTY_PROCEEDINGS, MAJOR_PENALTY_PROCEEDINGS, REFERRED_TO_CBI]   # an ordered outcome that withholds clearance

# P2.12a: inoperative accounts (illustrative; after the SOP on transaction-less and inoperative accounts)
inoperative_accounts:
  months_without_credit: 36      # no contribution, transfer in or interest for this long → inoperative
  co_workers_required: 2         # co-workers of the same establishment who confirm the member (crowdsourcing)
  ao_limit_paise: 50000000       # the AO reactivates / settles up to ₹5,00,000; above it the APFC

# P2.12b: voluntary coverage under section 1(4) (illustrative)
voluntary_coverage:
  threshold_employees: 20        # below this an establishment may opt in voluntarily …
  consent_share_bp: 5001         # … with the agreement of the employer and a majority of the employees (basis points)

# P2.12d: oversight periods (illustrative)
oversight_periods:
  rti_reply_days: 30             # RTI Act s.7(1): reply within 30 days of receipt
  privacy_response_days: 30      # a data-principal request is answered within this many days (illustrative)
  para_reply_days: 30            # an office replies to an internal-audit para within this many days (illustrative)

# P2.12e: the notified pattern of investment (illustrative bands, % of the corpus; as summarised in the SOP on the
# management and regulation of EPF exemption, Nov 2023, pp.17-18)
investment_pattern:
  GOVT_SECURITIES: {min_pct: 45, max_pct: 65}
  DEBT: {min_pct: 20, max_pct: 45}
  SHORT_TERM_DEBT: {min_pct: 0, max_pct: 5}
  EQUITY: {min_pct: 5, max_pct: 15}
  ASSET_BACKED: {min_pct: 0, max_pct: 5}
