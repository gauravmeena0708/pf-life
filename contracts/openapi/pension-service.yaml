components:
  securitySchemes:
    bffSession:
      type: apiKey
      in: cookie
      name: __Host-epfo-session
      description: Gateway session cookie (init.md §2.1, §6.6)
    clientCredentials:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: http://localhost:8080/realms/epfo-demo/protocol/openid-connect/token
          scopes: {}
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        maxLength: 128
      description: Required on money-changing and filing commands (init.md §3.3)
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
      description: Aggregate version for optimistic concurrency
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      schema:
        type: string
        format: uuid
    EstablishmentId:
      name: X-Establishment-Id
      in: header
      required: true
      schema:
        type: string
      description: Active establishment; validated server-side against the caller's grants
    StepUpToken:
      name: X-Step-Up-Token
      in: header
      required: true
      schema:
        type: string
      description: Proof of a completed step-up / transaction-intent confirmation (init.md §6.3)
  schemas:
    Problem:
      type: object
      description: RFC 9457 Problem Details
      required:
      - type
      - title
      - status
      - correlation_id
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        correlation_id:
          type: string
          format: uuid
    Meta:
      type: object
      required:
      - correlation_id
      - api_version
      - source
      - as_of
      properties:
        correlation_id:
          type: string
          format: uuid
        api_version:
          const: v1
        source:
          const: synthetic-poc
        as_of:
          type: string
          format: date-time
    Envelope:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          type: object
          description: Resource-specific; defined when the endpoint is implemented
        meta:
          $ref: '#/components/schemas/Meta'
    PensionEligibilityPreview:
      type: object
      additionalProperties: false
      required:
      - rule_version
      - total_eligible_service_months
      - threshold_months
      - meets_threshold
      - recommended_form
      - service_breakdown
      properties:
        rule_version:
          type: string
          description: Version of config/demo-rules.yaml used (ILLUSTRATIVE_ONLY)
        total_eligible_service_months:
          type: integer
          minimum: 0
        threshold_months:
          type: integer
          minimum: 0
          description: Service threshold from the illustrative rule set
        meets_threshold:
          type: boolean
        recommended_form:
          enum:
          - FORM_10D
          - FORM_10C_WITHDRAWAL
          - SCHEME_CERTIFICATE
        service_breakdown:
          type: array
          items:
            type: object
            required:
            - account_link_id
            - contributory_months
            - transferred_to_primary
            properties:
              account_link_id:
                type: string
                description: Opaque link to one member ID
              member_id_masked:
                type: string
              establishment_name:
                type: string
              contributory_months:
                type: integer
                minimum: 0
              transferred_to_primary:
                type: boolean
              action_required:
                type:
                - string
                - 'null'
                enum:
                - MEMBER_MUST_FILE_FORM_13_TRANSFER_FIRST
                - SERVICE_UNDER_AGGREGATION
                - null
  responses:
    Ok:
      description: Success
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Envelope'
    Created:
      description: Created
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Envelope'
    Problem:
      description: Error (RFC 9457)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Planned:
      description: Planned contract — not implemented in this POC. Returns type /problems/planned; never a fake success.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
