components:
  securitySchemes:
    bffSession:
      type: apiKey
      in: cookie
      name: __Host-epfo-session
      description: Gateway session cookie (init.md §2.1, §6.6)
    clientCredentials:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: http://localhost:8080/realms/epfo-demo/protocol/openid-connect/token
          scopes: {}
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        maxLength: 128
      description: Required on money-changing and filing commands (init.md §3.3)
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
      description: Aggregate version for optimistic concurrency
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      schema:
        type: string
        format: uuid
    EstablishmentId:
      name: X-Establishment-Id
      in: header
      required: true
      schema:
        type: string
      description: Active establishment; validated server-side against the caller's grants
    StepUpToken:
      name: X-Step-Up-Token
      in: header
      required: true
      schema:
        type: string
      description: Proof of a completed step-up / transaction-intent confirmation (init.md §6.3)
  schemas:
    Problem:
      type: object
      description: RFC 9457 Problem Details
      required:
      - type
      - title
      - status
      - correlation_id
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        correlation_id:
          type: string
          format: uuid
    Meta:
      type: object
      required:
      - correlation_id
      - api_version
      - source
      - as_of
      properties:
        correlation_id:
          type: string
          format: uuid
        api_version:
          const: v1
        source:
          const: synthetic-poc
        as_of:
          type: string
          format: date-time
    Envelope:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          type: object
          description: Resource-specific; defined when the endpoint is implemented
        meta:
          $ref: '#/components/schemas/Meta'
    LedgerLock:
      type: object
      description: Locks are leases with a TTL; a crashed holder's lock expires on its own and can also be released under
        supervision.
      required:
      - lock_id
      - lock_scope
      - resource_key
      - acquired_at
      - expires_at
      - acquired_by
      - is_stale
      properties:
        lock_id:
          type: string
        lock_scope:
          enum:
          - ANNUAL_ACCOUNTING
          - CLAIM_ADJUDICATION
          - ECR_POSTING
        resource_key:
          type: string
        acquired_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        acquired_by:
          type: string
          description: Actor or batch ID holding the lock
        is_stale:
          type: boolean
          description: True when the lease has expired or its holder's heartbeat stopped
        state:
          $ref: '#/components/schemas/LockState'
        lease_seconds:
          type: integer
          minimum: 1
          default: 600
          description: TTL of the lease (knowledge base §6.1 suggests 10 minutes for claim adjudication)
        renew_count:
          type: integer
          minimum: 0
        key_pattern:
          $ref: '#/components/schemas/LockKeyPattern'
    LockState:
      enum:
      - ACQUIRED
      - RENEWED
      - RELEASED
      - EXPIRED
      - FORCE_RELEASED
    LockKeyPattern:
      description: Hierarchical lock keys (knowledge base §6.1). The annual-accounts lock is exclusive on the member ledger;
        claim locks are scoped per claim so one claim never blocks queries or unrelated claims.
      enum:
      - LOCK:MEMBER:ANNUAL_ACCOUNTING:{member_id}
      - LOCK:MEMBER:CLAIM:{member_id}:{claim_id}
      - LOCK:ESTABLISHMENT:ECR:{establishment_id}:{wage_month}
    LockLifecycle:
      description: Allowed lock transitions. Leases are held in Redis with a TTL; every transition is audited.
      type: object
      x-transitions:
      - from:
        - none
        to: ACQUIRED
        actor: owning service or batch
        trigger: SET key NX PX lease_seconds
        guard: no live lease on the same key
      - from:
        - ACQUIRED
        - RENEWED
        to: RENEWED
        actor: holder
        trigger: heartbeat before expiry
        guard: caller still holds the fencing token
      - from:
        - ACQUIRED
        - RENEWED
        to: RELEASED
        actor: holder
        trigger: work committed or abandoned
      - from:
        - ACQUIRED
        - RENEWED
        to: EXPIRED
        actor: system
        trigger: TTL elapsed without renewal
        emits: audit entry LOCK_EXPIRED
      - from:
        - ACQUIRED
        - RENEWED
        to: FORCE_RELEASED
        actor: fo.oic or ho.is
        trigger: POST /office/system/locks/{lockId}/release
        guard: is_stale = true; reason ≥ 10 characters
        emits: LockReleased.v1
      x-invariants:
      - Every write under a lock carries the lock's fencing token; a write with an older token is rejected, so a holder that
        lost its lease cannot corrupt the ledger.
      - The annual-accounts batch takes one member ledger at a time; claims on other members are never blocked.
  responses:
    Ok:
      description: Success
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Envelope'
    Created:
      description: Created
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Envelope'
    Problem:
      description: Error (RFC 9457)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Planned:
      description: Planned contract — not implemented in this POC. Returns type /problems/planned; never a fake success.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
