components:
  securitySchemes:
    bffSession:
      type: apiKey
      in: cookie
      name: __Host-epfo-session
      description: Gateway session cookie (init.md §2.1, §6.6)
    clientCredentials:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: http://localhost:8080/realms/epfo-demo/protocol/openid-connect/token
          scopes: {}
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        maxLength: 128
      description: Required on money-changing and filing commands (init.md §3.3)
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
      description: Aggregate version for optimistic concurrency
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      schema:
        type: string
        format: uuid
    EstablishmentId:
