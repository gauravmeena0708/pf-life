components:
  securitySchemes:
    bffSession:
      type: apiKey
      in: cookie
      name: __Host-epfo-session
      description: Gateway session cookie (init.md §2.1, §6.6)
    clientCredentials:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: http://localhost:8080/realms/epfo-demo/protocol/openid-connect/token
          scopes: {}
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        maxLength: 128
      description: Required on money-changing and filing commands (init.md §3.3)
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
      description: Aggregate version for optimistic concurrency
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      schema:
        type: string
        format: uuid
    EstablishmentId:
      name: X-Establishment-Id
      in: header
      required: true
      schema:
        type: string
      description: Active establishment; validated server-side against the caller's grants
    StepUpToken:
      name: X-Step-Up-Token
      in: header
      required: true
      schema:
        type: string
      description: Proof of a completed step-up / transaction-intent confirmation (init.md §6.3)
  schemas:
    Problem:
      type: object
      description: RFC 9457 Problem Details
      required:
      - type
      - title
      - status
      - correlation_id
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        correlation_id:
          type: string
          format: uuid
    Meta:
      type: object
      required:
      - correlation_id
      - api_version
      - source
      - as_of
      properties:
        correlation_id:
          type: string
          format: uuid
        api_version:
          const: v1
        source:
          const: synthetic-poc
        as_of:
          type: string
          format: date-time
    Envelope:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          type: object
          description: Resource-specific; defined when the endpoint is implemented
        meta:
          $ref: '#/components/schemas/Meta'
    ClaimCad:
      type: object
      additionalProperties: false
      required:
      - cad_id
      - claim_id
      - generated_at
      - interest_paise
      - taxable_portion_paise
      - tds_paise
      - net_payable_paise
      - rule_version
      - static_data_version
      properties:
        cad_id:
          type: string
        claim_id:
          type: string
        generated_at:
          type: string
          format: date-time
        closing_balance_paise:
          type: integer
          minimum: 0
        interest_paise:
          type: integer
          minimum: 0
          description: Statutory interest component (illustrative rate from config)
        taxable_portion_paise:
          type: integer
          minimum: 0
        tds_paise:
          type: integer
          minimum: 0
        net_payable_paise:
          type: integer
          minimum: 0
        rule_version:
          type: string
        static_data_version:
          type: string
        rule_trace:
          type: array
          items:
            type: string
    CadStaticDataStatus:
      type: object
      required:
      - datasets
      properties:
        datasets:
          type: array
          items:
            type: object
            required:
            - name
            - version
            - loaded_at
            - status
            properties:
              name:
                enum:
                - INTEREST_TABLES
                - TDS_SLABS
                - BANK_BRANCH_MASTER
              version:
                type: string
              loaded_at:
                type: string
                format: date-time
              status:
                enum:
                - LOADED
                - STALE
                - FAILED
    BeneficiaryInwardRequest:
      type: object
      additionalProperties: false
      required:
      - full_name
      - relationship
      - bank_account_number
      - ifsc
      - proposed_share_bp
      properties:
        full_name:
          type: string
          description: Synthetic data only
        relationship:
          enum:
          - SPOUSE
          - SON
          - DAUGHTER
          - MOTHER
          - FATHER
          - DEPENDENT_BROTHER
          - DEPENDENT_SISTER
          - LEGAL_HEIR
        date_of_birth:
          type: string
          format: date
        is_minor:
          type: boolean
        guardian_name:
          type:
          - string
          - 'null'
        bank_account_number:
          type: string
          description: Synthetic; validated by the mock bank adapter
        ifsc:
          type: string
          pattern: ^[A-Z]{4}0[A-Z0-9]{6}$
        proposed_share_bp:
          type: integer
          minimum: 10
          maximum: 10000
          description: 'Basis points: 100 = 1%'
        legacy_settled_reference:
          type:
          - string
          - 'null'
          description: Reference of a share already settled in the legacy system
    BeneficiaryRecord:
      type: object
      required:
      - beneficiary_id
      - claim_id
      - relationship
      - share_bp
      - status
      properties:
        beneficiary_id:
          type: string
        claim_id:
          type: string
        relationship:
          type: string
        share_bp:
          type: integer
          minimum: 0
          maximum: 10000
        status:
          enum:
          - PENDING
          - LEGACY_SETTLED
          - APPROVED
          - DISBURSED
          - RETURNED
        legacy_settled_reference:
          type:
          - string
          - 'null'
    ShareAmendmentRequest:
      type: object
      additionalProperties: false
      required:
      - new_share_bp
      - reason_code
      properties:
        new_share_bp:
          type: integer
          minimum: 10
          maximum: 10000
        reason_code:
          enum:
          - NOMINEE_DECEASED
          - COURT_ORDER
          - LEGACY_SETTLEMENT_OFFSET
          - GUARDIAN_APPOINTMENT
        justification_notes:
          type: string
    SharesSummary:
      type: object
      description: Invariant — allocated_bp = legacy_settled_bp + disbursed_bp + pending_bp and allocated_bp ≤ 10000.
      required:
      - claim_id
      - allocated_bp
      - legacy_settled_bp
      - disbursed_bp
      - pending_bp
      - beneficiaries
      properties:
        claim_id:
          type: string
        allocated_bp:
          type: integer
          minimum: 0
          maximum: 10000
        legacy_settled_bp:
          type: integer
          minimum: 0
          maximum: 10000
        disbursed_bp:
          type: integer
          minimum: 0
          maximum: 10000
        pending_bp:
          type: integer
          minimum: 0
          maximum: 10000
        beneficiaries:
          type: array
          items:
            $ref: '#/components/schemas/BeneficiaryRecord'
    ReDisbursementRequest:
      type: object
      additionalProperties: false
      required:
      - bank_account_number
      - ifsc
      properties:
        bank_account_number:
          type: string
          description: Synthetic; must pass the mock penny-drop check
        ifsc:
          type: string
          pattern: ^[A-Z]{4}0[A-Z0-9]{6}$
    PensionEligibilityPreview:
      type: object
      additionalProperties: false
      required:
      - rule_version
      - total_eligible_service_months
      - threshold_months
      - meets_threshold
      - recommended_form
      - service_breakdown
      properties:
        rule_version:
          type: string
          description: Version of config/demo-rules.yaml used (ILLUSTRATIVE_ONLY)
        total_eligible_service_months:
          type: integer
          minimum: 0
        threshold_months:
          type: integer
          minimum: 0
          description: Service threshold from the illustrative rule set
        meets_threshold:
          type: boolean
        recommended_form:
          enum:
          - FORM_10D
          - FORM_10C_WITHDRAWAL
          - SCHEME_CERTIFICATE
        service_breakdown:
          type: array
          items:
            type: object
            required:
            - account_link_id
            - contributory_months
            - transferred_to_primary
            properties:
              account_link_id:
                type: string
                description: Opaque link to one member ID
              member_id_masked:
                type: string
              establishment_name:
                type: string
              contributory_months:
                type: integer
                minimum: 0
              transferred_to_primary:
                type: boolean
              action_required:
                type:
                - string
                - 'null'
                enum:
                - MEMBER_MUST_FILE_FORM_13_TRANSFER_FIRST
                - SERVICE_UNDER_AGGREGATION
                - null
    LedgerLock:
      type: object
      description: Locks are leases with a TTL; a crashed holder's lock expires on its own and can also be released under
        supervision.
      required:
      - lock_id
      - lock_scope
      - resource_key
      - acquired_at
      - expires_at
      - acquired_by
      - is_stale
      properties:
        lock_id:
          type: string
        lock_scope:
          enum:
          - ANNUAL_ACCOUNTING
          - CLAIM_ADJUDICATION
          - ECR_POSTING
        resource_key:
          type: string
        acquired_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        acquired_by:
          type: string
          description: Actor or batch ID holding the lock
        is_stale:
          type: boolean
  responses:
    Ok:
      description: Success
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Envelope'
    Created:
      description: Created
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Envelope'
    Problem:
      description: Error (RFC 9457)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Planned:
      description: Planned contract — not implemented in this POC. Returns type /problems/planned; never a fake success.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
