    BlockerCode:
      description: 'Why a claim on this account would fail today. Source error texts (Samadhan Setu): UAN_NOT_LINKED_TO_MEMBER_ID
        ← "UAN is not registered against this member ID"; MEMBER_RECORD_NOT_FOUND ← "No member record found for the provided
        UAN / member ID"; ANNUAL_ACCOUNTING_IN_PROGRESS ← "Annual accounting is under process for this member"; CLAIM_ALREADY_IN_PROCESS
        ← "concurrent claims already under processing" (only when a live lock or open claim really exists); LEGACY_TRANSACTION_NOT_MIGRATED
        ← "legacy system transaction is not migrated in ledger"; PRIMARY_MEMBER_ID_INCORRECT ← "incorrect Primary Member ID
        marked"; TRANSFER_IN_SERVICE_NOT_CALCULATED ← "tr-in service not calculating".'
      enum:
      - KYC_AADHAAR_MISSING
      - KYC_BANK_NOT_VERIFIED
      - UAN_NOT_ACTIVATED
      - UAN_NOT_LINKED_TO_MEMBER_ID
      - MEMBER_RECORD_NOT_FOUND
      - EXIT_DATE_NOT_MARKED
      - ACCOUNT_FROZEN
      - ACCOUNT_INOPERATIVE
      - ANNUAL_ACCOUNTING_IN_PROGRESS
      - CLAIM_ALREADY_IN_PROCESS
      - LEGACY_TRANSACTION_NOT_MIGRATED
      - PRIMARY_MEMBER_ID_INCORRECT
      - TRANSFER_PENDING
      - TRANSFER_IN_SERVICE_NOT_CALCULATED
