components:
  securitySchemes:
    bffSession:
      type: apiKey
      in: cookie
      name: __Host-epfo-session
      description: Gateway session cookie (init.md §2.1, §6.6)
    clientCredentials:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: http://localhost:8080/realms/epfo-demo/protocol/openid-connect/token
          scopes: {}
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        maxLength: 128
      description: Required on money-changing and filing commands (init.md §3.3)
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
      description: Aggregate version for optimistic concurrency
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      schema:
        type: string
        format: uuid
    EstablishmentId:
      name: X-Establishment-Id
      in: header
      required: true
      schema:
        type: string
      description: Active establishment; validated server-side against the caller's grants
    StepUpToken:
      name: X-Step-Up-Token
      in: header
      required: true
      schema:
        type: string
      description: Proof of a completed step-up / transaction-intent confirmation (init.md §6.3)
  schemas:
    Problem:
      type: object
      description: RFC 9457 Problem Details
      required:
      - type
      - title
      - status
      - correlation_id
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        correlation_id:
          type: string
          format: uuid
    Meta:
      type: object
      required:
      - correlation_id
      - api_version
      - source
      - as_of
      properties:
        correlation_id:
          type: string
          format: uuid
        api_version:
          const: v1
        source:
          const: synthetic-poc
        as_of:
          type: string
          format: date-time
    Envelope:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          type: object
          description: Resource-specific; defined when the endpoint is implemented
        meta:
          $ref: '#/components/schemas/Meta'
    ClaimState:
      enum:
      - DRAFT
      - AWAITING_CONFIRMATION
      - SUBMITTED
      - CANCELLED
      - AUTO_APPROVED
      - UNDER_REVIEW
      - RECOMMENDED
      - AWAITING_NEXT_APPROVAL
      - APPROVED
      - REJECTED_WITH_REASON
      - PAYMENT_PENDING
      - SETTLED
      - PAYMENT_RETURNED
      - CORRECTION_PENDING
      - REISSUE_APPROVED
      - ON_HOLD_FROZEN
    ClaimStateMachine:
      description: Allowed transitions of a claim. Anything not listed returns 409. `endpoint` is the API that triggers the
        transition ("event" when a consumed domain event triggers it). The knowledge base's RETURNED_TO_OFFICE state is PAYMENT_RETURNED
        here.
      type: object
      x-transitions:
      - from:
        - none
        to: DRAFT
        actor: member
        endpoint: POST /members/me/claims
      - from:
        - DRAFT
        to: AWAITING_CONFIRMATION
        actor: member
        endpoint: POST /members/me/claims (submit)
      - from:
        - AWAITING_CONFIRMATION
        to: SUBMITTED
        actor: member
        endpoint: POST /members/me/claims/{claimId}/confirmations
        guard: step-up bound to this claim
        emits: ClaimSubmitted.v1
      - from:
        - DRAFT
        - AWAITING_CONFIRMATION
        - SUBMITTED
        - UNDER_REVIEW
        to: CANCELLED
        actor: member
        endpoint: POST /members/me/claims/{claimId}/cancellations
        guard: no recommendation recorded yet
      - from:
        - SUBMITTED
        to: AUTO_APPROVED
        actor: system
        endpoint: event
        guard: auto-settlement allowed for type and amount; no open risk signal
        emits: ClaimDecisionRecorded.v1
      - from:
        - SUBMITTED
        to: UNDER_REVIEW
        actor: system
        endpoint: event
        guard: case opened in workflow-service (transactional outbox)
      - from:
        - UNDER_REVIEW
        to: UNDER_REVIEW
        actor: fo.oic or SLA timer
        endpoint: POST /office/cases/{caseId}/assignments
        guard: same jurisdiction
      - from:
        - UNDER_REVIEW
        to: RECOMMENDED
        actor: fo.da_accounts
        endpoint: POST /office/cases/{caseId}/recommendations
        guard: employer-signed documents viewed (POST …/attestation-views); claim-adjudication lock held
      - from:
        - RECOMMENDED
        to: AWAITING_NEXT_APPROVAL | APPROVED | REJECTED_WITH_REASON
        actor: first checker of the amount band
        endpoint: POST /office/cases/{caseId}/decisions
        guard: approver ≠ recommender; authorised for band and jurisdiction
        emits: CaseDecisionSubmitted.v1
      - from:
        - AWAITING_NEXT_APPROVAL
        to: AWAITING_NEXT_APPROVAL | APPROVED | REJECTED_WITH_REASON
        actor: next checker of the band
        endpoint: POST /office/cases/{caseId}/second-approvals
        guard: different person from every earlier checker
      - from:
        - RECOMMENDED
        - AWAITING_NEXT_APPROVAL
        to: UNDER_REVIEW
        actor: any checker
        endpoint: POST /office/cases/{caseId}/decisions (return)
        guard: reason given; earlier approvals void
      - from:
        - APPROVED
        - AUTO_APPROVED
        to: PAYMENT_PENDING
        actor: fo.cash or system
        endpoint: POST /office/claims/{claimId}/payment-instructions
        guard: CAD generated (POST …/cad); ClaimDebitPosted.v1 received; account not frozen
        emits: PaymentInstructed.v1
      - from:
        - PAYMENT_PENDING
        to: SETTLED
        actor: system
        endpoint: event
        guard: signed bank confirmation
        emits: NotificationRequested.v1
      - from:
        - SETTLED
        to: SETTLED
        actor: system
        endpoint: event
        guard: 'late credit (transfer-in or contribution) on a settled account: never lock the ledger'
        emits: SupplementaryClaimEligible.v1
      - from:
        - PAYMENT_PENDING
        to: PAYMENT_RETURNED
        actor: system
        endpoint: event
        guard: signed bank return
        emits: PaymentReturned.v1, NotificationRequested.v1
      - from:
        - PAYMENT_RETURNED
        to: CORRECTION_PENDING
        actor: member
        endpoint: POST /members/me/claims/{claimId}/re-disbursement-requests
        guard: new account passes mock penny-drop
      - from:
        - CORRECTION_PENDING
        to: REISSUE_APPROVED
        actor: fo.apfc
        endpoint: POST /office/claims/{claimId}/re-disbursement-approvals
        guard: adjudication not reopened
      - from:
        - REISSUE_APPROVED
        to: PAYMENT_PENDING
        actor: fo.cash
        endpoint: POST /office/claims/{claimId}/reissues
        emits: PaymentInstructed.v1
      - from:
        - SUBMITTED
        - UNDER_REVIEW
        - RECOMMENDED
        - AWAITING_NEXT_APPROVAL
        - APPROVED
        - AUTO_APPROVED
        to: same state
        actor: member
        endpoint: PUT /members/me/claims/{claimId}/bank-details
        guard: target account is KYC-verified; audit entry only
      - from:
        - DRAFT
        - AWAITING_CONFIRMATION
        - SUBMITTED
        - UNDER_REVIEW
        - RECOMMENDED
        - AWAITING_NEXT_APPROVAL
        - APPROVED
        - AUTO_APPROVED
        to: ON_HOLD_FROZEN
        actor: system
        endpoint: event
        guard: freeze order; prior state stored
      - from:
        - ON_HOLD_FROZEN
        to: SUBMITTED | UNDER_REVIEW
        actor: system
        endpoint: event
        guard: de-freeze order; SUBMITTED if frozen before any recommendation, else UNDER_REVIEW with approvals void and the
          after-defreeze chain
    ClaimEligibilityPreview:
      type: object
      additionalProperties: false
      required:
      - form_type
      - eligible
      - rule_version
      - blockers
      - required_documents
      properties:
        form_type:
          enum:
          - FORM_31
          - FORM_19
          - FORM_10C
          - FORM_10D
          - FORM_13
        account_link_id:
          type: string
        eligible:
          type: boolean
        rule_version:
          type: string
          description: Illustrative rule set (config/demo-rules.yaml)
        max_amount_paise:
          type:
          - integer
          - 'null'
          minimum: 0
          description: Upper limit for this form under the rule version
          where one applies: null
        purposes:
          type: array
          description: Allowed advance purposes (Form 31 only)
          items:
            type: string
        blockers:
          type: array
          description: Same codes as member-service AccountStatus, plus rule failures
          items:
            enum:
            - KYC_AADHAAR_MISSING
            - KYC_BANK_NOT_VERIFIED
            - UAN_NOT_ACTIVATED
            - UAN_NOT_LINKED_TO_MEMBER_ID
            - MEMBER_RECORD_NOT_FOUND
            - EXIT_DATE_NOT_MARKED
            - ACCOUNT_FROZEN
            - ACCOUNT_INOPERATIVE
            - ANNUAL_ACCOUNTING_IN_PROGRESS
            - CLAIM_ALREADY_IN_PROCESS
            - LEGACY_TRANSACTION_NOT_MIGRATED
            - PRIMARY_MEMBER_ID_INCORRECT
            - TRANSFER_PENDING
            - TRANSFER_IN_SERVICE_NOT_CALCULATED
            - SERVICE_BELOW_THRESHOLD
            - WAITING_PERIOD_NOT_MET
            - PURPOSE_LIMIT_REACHED
        required_documents:
          type: array
          items:
            type: string
        recommended_action:
          type:
          - string
          - 'null'
    ClaimAuditEntryMemberView:
      type: object
      additionalProperties: false
      required:
      - at
      - from_state
      - to_state
      - actor_role
      properties:
        at:
          type: string
          format: date-time
        from_state:
          oneOf:
          - $ref: '#/components/schemas/ClaimState'
          - type: 'null'
        to_state:
          $ref: '#/components/schemas/ClaimState'
        actor_role:
          type: string
          description: Role only (e.g. SECTION_SUPERVISOR); officer identities are withheld from members
        reason_code:
          type:
          - string
          - 'null'
        note:
          type:
          - string
          - 'null'
          description: Member-safe explanation
    ClaimAuditEntry:
      type: object
      additionalProperties: false
      required:
      - at
      - action
      - actor_id
      - actor_role
      - correlation_id
      properties:
        at:
          type: string
          format: date-time
        action:
          enum:
          - STATE_CHANGE
          - LOCK_ACQUIRED
          - LOCK_RELEASED
          - LOCK_EXPIRED
          - CAD_GENERATED
          - DOCUMENT_VIEWED
          - BANK_DETAILS_CHANGED
          - SHARE_AMENDED
          - PAYMENT_EVENT
        from_state:
          oneOf:
          - $ref: '#/components/schemas/ClaimState'
          - type: 'null'
        to_state:
          oneOf:
          - $ref: '#/components/schemas/ClaimState'
          - type: 'null'
        actor_id:
          type: string
        actor_role:
          type: string
        approval_level:
          type:
          - integer
          - 'null'
          minimum: 1
        rule_version:
          type:
          - string
          - 'null'
        cad_id:
          type:
          - string
          - 'null'
        reason_code:
          type:
          - string
          - 'null'
        correlation_id:
          type: string
        audit_hash:
          type: string
