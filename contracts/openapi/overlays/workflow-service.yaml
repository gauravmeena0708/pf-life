# Hand-written overlay for workflow-service. Merged by docs/tools/build_gate0.py.
# Source: ../samadhan-setu files/PF_LIFE_INTEGRATION_SPECIFICATION.md §3.C. Path parameter renamed
# {memberId} -> {uan} to match the existing /office/members/{uan} routes.

paths:
  /office/members/{uan}/locks:
    get:
      responses:
        "200":
          description: Active locks on the member ledger
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: {type: array, items: {$ref: "#/components/schemas/LedgerLock"}}

  /office/system/locks/{lockId}/release:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: {type: string, minLength: 10}
      responses:
        "200":
          description: Lock released; LockReleased.v1 emitted and audited
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Envelope"}
        "409":
          description: Lock is not stale (its owner is still alive); release refused
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}

  /office/cases/{caseId}/documents/{docId}/attestation-views:
    post:
      responses:
        "201":
          description: View recorded; the case's approve action is now enabled for this caseworker
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Envelope"}

components:
  schemas:
    LedgerLock:
      type: object
      description: Locks are leases with a TTL; a crashed holder's lock expires on its own and can also be released under supervision.
      required: [lock_id, lock_scope, resource_key, acquired_at, expires_at, acquired_by, is_stale]
      properties:
        lock_id: {type: string}
        lock_scope: {enum: [ANNUAL_ACCOUNTING, CLAIM_ADJUDICATION, ECR_POSTING]}
        resource_key: {type: string}
        acquired_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        acquired_by: {type: string, description: Actor or batch ID holding the lock}
        is_stale: {type: boolean, description: True when the lease has expired or its holder's heartbeat stopped}
        state: {$ref: "#/components/schemas/LockState"}
        lease_seconds: {type: integer, minimum: 1, default: 600, description: TTL of the lease (knowledge base §6.1 suggests 10 minutes for claim adjudication)}
        renew_count: {type: integer, minimum: 0}
        key_pattern: {$ref: "#/components/schemas/LockKeyPattern"}

    LockState:
      enum: [ACQUIRED, RENEWED, RELEASED, EXPIRED, FORCE_RELEASED]

    LockKeyPattern:
      description: >-
        Hierarchical lock keys (knowledge base §6.1). The annual-accounts lock is exclusive on the member ledger;
        claim locks are scoped per claim so one claim never blocks queries or unrelated claims.
      enum:
        - "LOCK:MEMBER:ANNUAL_ACCOUNTING:{member_id}"
        - "LOCK:MEMBER:CLAIM:{member_id}:{claim_id}"
        - "LOCK:ESTABLISHMENT:ECR:{establishment_id}:{wage_month}"

    LockLifecycle:
      description: Allowed lock transitions. Leases are held in Redis with a TTL; every transition is audited.
      type: object
      x-transitions:
        - {from: [none], to: ACQUIRED, actor: "owning service or batch", trigger: "SET key NX PX lease_seconds", guard: no live lease on the same key}
        - {from: [ACQUIRED, RENEWED], to: RENEWED, actor: holder, trigger: heartbeat before expiry, guard: caller still holds the fencing token}
        - {from: [ACQUIRED, RENEWED], to: RELEASED, actor: holder, trigger: work committed or abandoned}
        - {from: [ACQUIRED, RENEWED], to: EXPIRED, actor: system, trigger: TTL elapsed without renewal, emits: audit entry LOCK_EXPIRED}
        - {from: [ACQUIRED, RENEWED], to: FORCE_RELEASED, actor: "fo.oic or ho.is", trigger: "POST /office/system/locks/{lockId}/release", guard: "is_stale = true; reason ≥ 10 characters", emits: LockReleased.v1}
      x-invariants:
        - Every write under a lock carries the lock's fencing token; a write with an older token is rejected, so a holder that lost its lease cannot corrupt the ledger.
        - The annual-accounts batch takes one member ledger at a time; claims on other members are never blocked.
