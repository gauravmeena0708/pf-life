name: stack verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stack-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stack:
    name: fresh migrations and ${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      # Each suite gets its own runner and empty volumes. They mutate the same seeded records.
      matrix:
        suite: [e2e, security, resilience, ui]
    env:
      COMPOSE_PROJECT_NAME: epfo-ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.suite }}
      COMPOSE_FILE: compose.yaml:compose.lite.yaml
      COMPOSE_PARALLEL_LIMIT: "4"
      AI_PROVIDER: disabled
      SUITE: ${{ matrix.suite }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the browser test dependencies
        run: |
          python -m pip install -r scripts/lifecycles/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Check CI helpers
        run: python -m pytest -q -p no:cacheprovider scripts/ci/tests scripts/manuals/tests scripts/lifecycles/tests
      - name: Configure the synthetic stack
        run: |
          cp .env.example .env
          mkdir -p ci-results
          docker compose config -q
      - name: Build the stack
        run: docker compose build
      - name: Start infrastructure with empty databases
        run: docker compose up -d --wait --wait-timeout 180 postgres redis rabbitmq
      - name: Migrate every configured database service before starting consumers
        run: python scripts/ci/stack_checks.py migrate
      - name: Start services and wait for browser entry points
        run: |
          docker compose up -d --wait --wait-timeout 240
          python scripts/ci/stack_checks.py wait
      - name: Load synthetic data
        run: python scripts/seed_synthetic_data.py
      - name: Run the suite
        run: |
          if [ "$SUITE" = "ui" ]; then
            python scripts/ui_manuals.py --suite all --output ci-results/ui-manuals
          else
            python -m pytest -q -p no:cacheprovider "tests/$SUITE" --junitxml=ci-results/results.xml
            python scripts/ci/stack_checks.py results ci-results/results.xml
          fi
      - name: Collect stack diagnostics
        if: always()
        run: |
          mkdir -p ci-results
          docker compose ps -a > ci-results/compose-status.txt
          docker compose logs --no-color --tail 200 > ci-results/compose.log 2>&1
      - name: Upload test results, screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stack-${{ matrix.suite }}-${{ github.run_attempt }}
          path: |
            ci-results/
            tests/e2e/screenshots/
          retention-days: 7
          if-no-files-found: warn
      - name: Remove this runner's stack and volumes
        if: always()
        run: docker compose down --volumes --remove-orphans
