# EPFO POC — SYNTHETIC DEMONSTRATION, NOT AN OFFICIAL EPFO SYSTEM.
# Local runtime (docs/adr/0007-local-runtime.md). All host ports bind to 127.0.0.1.
# Services, ports and networks follow init.md §2.4. Overrides: compose.lite.yaml, compose.dev-direct.yaml.
name: epfo-poc
services:
  postgres:
    image: postgres:16.4-alpine
    restart: unless-stopped
    command:
    - postgres
    - -c
    - hba_file=/etc/postgresql/pg_hba.conf
    - -c
    - password_encryption=scram-sha-256
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      EMPLOYER_DB_PASSWORD: ${EMPLOYER_DB_PASSWORD}
      MEMBER_DB_PASSWORD: ${MEMBER_DB_PASSWORD}
      CONTRIBUTION_DB_PASSWORD: ${CONTRIBUTION_DB_PASSWORD}
      CLAIM_DB_PASSWORD: ${CLAIM_DB_PASSWORD}
      PAYMENT_SIMULATOR_DB_PASSWORD: ${PAYMENT_SIMULATOR_DB_PASSWORD}
      WORKFLOW_DB_PASSWORD: ${WORKFLOW_DB_PASSWORD}
      GRIEVANCE_DB_PASSWORD: ${GRIEVANCE_DB_PASSWORD}
      AUDIT_DB_PASSWORD: ${AUDIT_DB_PASSWORD}
      REPORTING_DB_PASSWORD: ${REPORTING_DB_PASSWORD}
      INTELLIGENCE_DB_PASSWORD: ${INTELLIGENCE_DB_PASSWORD}
      PENSION_DB_PASSWORD: ${PENSION_DB_PASSWORD}
      PLATFORM_DB_PASSWORD: ${PLATFORM_DB_PASSWORD}
      MOCK_INTEGRATIONS_DB_PASSWORD: ${MOCK_INTEGRATIONS_DB_PASSWORD}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      REPORTING_RO_DB_PASSWORD: ${REPORTING_RO_DB_PASSWORD}
    volumes:
    - postgres-data:/var/lib/postgresql/data
    - ./infra/database/init:/docker-entrypoint-initdb.d:ro
    - ./infra/database/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    ports:
    - 127.0.0.1:5432:5432
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U postgres
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      data-employer-service: {}
      data-member-service: {}
      data-contribution-service: {}
      data-claim-service: {}
      data-payment-simulator: {}
      data-workflow-service: {}
      data-grievance-service: {}
      data-audit-service: {}
      data-reporting-service: {}
      data-intelligence-service: {}
      data-pension-service: {}
      data-platform-service: {}
      data-mock-integrations: {}
      data-keycloak: {}
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command:
    - redis-server
    - --appendonly
    - 'no'
    - --save
    - ''
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
    - services
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      # No definitions preload: loading definitions at boot skips creating the default user.
      # Producers and consumers declare epfo.events and epfo.events.dlx themselves (epfo_persistence).
    ports:
    - 127.0.0.1:5672:5672
    - 127.0.0.1:15672:15672
    healthcheck:
      test:
      - CMD
      - rabbitmq-diagnostics
      - -q
      - ping
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
    - services
  object-store:
    image: chrislusf/seaweedfs:3.99
    restart: unless-stopped
    command:
    - server
    - -dir=/data
    - -s3
    - -s3.port=8333
    - -s3.config=/etc/seaweedfs/s3.json
    - -volume.max=0
    - -master.volumeSizeLimitMB=256
    volumes:
    - object-store-data:/data
    - ./infra/object-store/s3.json:/etc/seaweedfs/s3.json:ro
    ports:
    - 127.0.0.1:8333:8333
    networks:
    - storage
  keycloak:
    image: quay.io/keycloak/keycloak:26.0.5
    command:
    - start-dev
    - --import-realm
    restart: unless-stopped
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak_db
      KC_DB_USERNAME: keycloak_app
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: 'true'
      KC_HEALTH_ENABLED: 'true'
      KC_HTTP_ENABLED: 'true'
    volumes:
    - ./infra/keycloak/realm-epfo-demo.json:/opt/keycloak/data/import/realm-epfo-demo.json:ro
    ports:
    - 127.0.0.1:8080:8080
    depends_on:
      postgres:
        condition: service_healthy
    networks:
    - edge
    - data-keycloak
  gateway:
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile
    restart: unless-stopped
    env_file:
    - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      KEYCLOAK_ISSUER: ${KEYCLOAK_PUBLIC_ISSUER}
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      GATEWAY_PUBLIC_ORIGIN: http://localhost:5173
    ports:
    - 127.0.0.1:8000:8000
    depends_on:
      redis:
        condition: service_healthy
      keycloak:
        condition: service_started
    networks:
    - edge
    - services
  web:
    build:
      context: apps/web
    restart: unless-stopped
    environment:
      VITE_GATEWAY_URL: http://gateway:8000
    ports:
    - 127.0.0.1:5173:5173
    depends_on:
    - gateway
    networks:
    - edge
  employer-service:
    build:
      context: .
      dockerfile: services/employer-service/Dockerfile
    restart: unless-stopped
    environment:
      SERVICE_NAME: employer-service
      DATABASE_URL: postgresql+asyncpg://employer_app:${EMPLOYER_DB_PASSWORD}@postgres:5432/employer_db
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      GATEWAY_JWKS_URL: http://gateway:8000/internal/jwks
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-1}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
      - CMD-SHELL
      - python -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3).status==200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      services: {}
      data-employer-service: {}
