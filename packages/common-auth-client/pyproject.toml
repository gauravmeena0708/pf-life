[project]
name = "epfo-auth-client"
version = "0.1.0"
description = "Verify the gateway-signed internal JWT (ADR-0002) and expose the caller to EPFO POC services."
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.4",
  "pyjwt[crypto]==2.9.0",
  "httpx==0.27.2",
  "epfo-observability",
]

[project.optional-dependencies]
test = ["pytest==8.3.3"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["epfo_auth"]
