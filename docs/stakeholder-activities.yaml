# ─────────────────────────── F12 Audit ───────────────────────────
  - {id: F12.concurrent, actor: zo.rpfc1_audit, does: "Download daily functionality data from the Audit Portal; flag suspicious cases; alert ROs; review replies", api: ["GET /audit/events", "GET /audit/concurrent/extracts", "POST /audit/concurrent/alerts"], next: [F12.reply], src: AUD, ev: V}
  - {id: F12.reply, actor: fo.oic, does: "Reply to concurrent-audit alerts within 3 days", api: ["POST /audit/concurrent/alerts/{alertId}/replies"], next: [], src: AUD, ev: D}
  - {id: F12.internal, actor: zo.internal_audit, does: "Internal audit of an RO; raise audit paras", api: ["POST /audit/internal/reports", "POST /audit/internal/reports/{reportId}/paras", "GET /audit/correlations/{correlationId}"], next: [F12.para_reply], src: AUD, ev: D, fut: true}
  - {id: F12.para_reply, actor: fo.oic, does: "Comply with audit paras; request dropping", api: ["POST /audit/internal/paras/{paraId}/replies"], next: [F12.ho], src: AUD, ev: D}
  - {id: F12.ho, actor: ho.audit, does: "Audit Division: plan audits, IT audit, pre-audit, drop paras, oversee CAG audit", api: ["GET /audit/events", "GET /audit/correlations/{correlationId}", "POST /audit/internal/paras/{paraId}/decisions"], next: [], src: AUD, ev: D}
  - {id: F12.claim_trail, actor: zo.rpfc1_audit, does: "Inspect a claim's full audit trail (transitions, approval levels, rule and CAD versions, lock events)", api: ["GET /office/claims/{claimId}/audit-trail", "GET /audit/correlations/{correlationId}"], next: [F12.reply], src: "SS, AUD", ev: D}
