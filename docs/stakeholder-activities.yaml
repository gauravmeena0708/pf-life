  - {id: F13.public, actor: public, does: "Browse schemes, offices, statistics, circulars; search establishments; calculators; TRRN status", api: ["GET /public/schemes", "GET /public/offices", "GET /public/statistics", "GET /public/circulars", "GET /public/establishments", "GET /public/establishments/{estId}", "GET /public/demo-challenges", "GET /public/establishments/{estId}/e-report-card", "GET /public/defaulting-establishments", "POST /public/demo-calculations/epf", "POST /public/demo-calculations/pension", "POST /public/trrn-status-lookups", "POST /ai/knowledge/search"], next: [], src: WEB, ev: V}
