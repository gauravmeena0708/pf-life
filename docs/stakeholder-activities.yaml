# ─────────────────────────── F11 Inoperative accounts ───────────────────────────
  - {id: F11.search, actor: member.exited, does: "Search inoperative accounts; request reactivation / settlement (online, at FO or NAN camp)", api: ["POST /public/inoperative-accounts/searches", "POST /members/me/claims"], next: [F11.verify], src: WSU, ev: D}
