  - {id: F11.approve, actor: fo.ao, does: "Approve reactivation / settlement in the AO band; forward higher bands", api: ["POST /office/accounts/{accountLinkId}/reactivations"], next: [F11.approve_apfc], chain: inoperative_settlement, src: WSU, ev: D}
