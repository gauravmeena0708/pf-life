separation_of_duties:
  claim_settlement:
    src: FIA 8(xvi); WSU 5.4.2
    bands:
    - upto: 50000
      chain:
      - fo.da_accounts
      - fo.ss
    - upto: 500000
      chain:
      - fo.da_accounts
      - fo.ao
    - upto: 2500000
      chain:
      - fo.da_accounts
      - fo.ss
      - fo.apfc
    - above: 2500000
      chain:
      - fo.da_accounts
      - fo.ao
      - fo.oic
  claim_settlement_after_defreeze:
    src: FIA 8(xvi)
    bands:
    - upto: 50000
      chain:
      - fo.da_accounts
      - fo.ss
      - fo.ao
    - upto: 500000
      chain:
      - fo.da_accounts
      - fo.ao
      - fo.apfc
    - above: 500000
      chain:
      - fo.da_accounts
      - fo.ao
      - fo.apfc
      - fo.oic
      notify:
      - zo.rpfc1
      - zo.rpfc1_audit
  inoperative_settlement:
    src: WSU 5.1, 5.5
    note: several amount bands; exact bands to be copied from WSU tables into config
    chain:
    - fo.da_accounts
    - fo.ss
    - fo.ao
    - fo.apfc
    - fo.oic
  joint_declaration:
    src: JD 4.3-4.5, Table 3
    chain:
    - employer.signatory
    - fo.da_accounts
    - fo.ss
    - fo.apfc
    note: verifier is SS or AO; approver is RPFC-I / RPFC-II / APFC / AO / SS by change type (major / minor) per JD Table
      3
  freeze_verification_member:
    src: FIA 8(vi-viii)
    chain:
